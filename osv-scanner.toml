# zod 3 comes in by two paths; the fix is only in zod 4.6.6, and neither path takes zod 4 yet.
# (1) @anthropic-ai/sandbox-runtime requires ^3.25. tars uses it as a library, where zod parses
#     no outside input: only the `srt` CLI config loader and the external-decider mode call it,
#     and tars uses neither (r54).
# (2) @a2ui/web_core and @a2ui/react nest zod 3.25.76 (A2UI 0.15.0 requires zod 3 and breaks on
#     zod 4). It runs only in the browser, in the page's lazily loaded A2UI chunk, and parses
#     ui_show input, which a tool_call caps at 16 KiB (TOOL_TEXT_BYTES). How much memory an
#     input that size can make it use has not been measured.
# zod 3 has no fixed release. Re-check when this expires: does A2UI take zod 4, is
# sandbox-runtime upgraded.
[[IgnoredVulns]]
id = "GHSA-mrhx-c7xc-m3w5"
ignoreUntil = 2027-02-23
reason = "zod 3 parses no outside input in sandbox-runtime's library path (r54); in the browser A2UI chunk it parses ui_show input capped at 16 KiB, memory bound not measured; no zod 3 fix"
